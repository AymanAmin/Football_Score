name: Fix Supabase URL

on:
  push:
    paths:
      - '.github/workflows/fix-supabase-url.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fix Supabase project URL and refresh cache
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/tseniigzftrxvqaspnnp/tseniigzftrxvqasprnp/g' cloud-config.js
          sed -i 's/football-score-v1.3.0/football-score-v1.3.1/g' service-worker.js

      - name: Commit fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloud-config.js service-worker.js
          git commit -m "Fix Supabase project URL"
          git push
